spring.application.name=fg-taller-git-2026

# --- Codificación de las respuestas (tildes en el JSON) ---
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- H2: base embebida guardada en un archivo (./data/cs2db.mv.db) ---
spring.datasource.url=jdbc:h2:file:./data/cs2db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Consola web de H2 (solo desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- OpenAPI 3 (springdoc) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# --- POO-09: compañeros del grupo (CS2). Se cambian sin tocar código: A2_BASE_URL=... A3_BASE_URL=... ---
# A2 = Matias Enciso: atenuación del daño de la explosión por distancia (GET, solo lectura)
companeros.a2.nombre=Matias Enciso
companeros.a2.base-url=${A2_BASE_URL:http://localhost:8081}
companeros.a2.ruta=${A2_RUTA:/api/simulacion/explosion}
# A3 = Diana Aquino: legalidad del lanzamiento (fuego amigo y alcance máximo)
companeros.a3.nombre=Diana Aquino
companeros.a3.base-url=${A3_BASE_URL:http://localhost:8082}
companeros.a3.ruta=${A3_RUTA:/api/armas/granadas/simular}
companeros.a3.equipo-terroristas=Terrorista
companeros.a3.equipo-antiterroristas=Counter-Terrorista
# Si un compañero no responde en este tiempo, el escenario responde 503 y no guarda nada
companeros.timeout-ms=${COMPANEROS_TIMEOUT_MS:3000}
