spring.application.name=fg-taller-git-2026

# --- Codificación de las respuestas (tildes en el JSON) ---
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- H2: base embebida guardada en un archivo (./data/cs2db.mv.db) ---
spring.datasource.url=jdbc:h2:file:./data/cs2db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Consola web de H2 (solo desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
