# Pruebas: base H2 en memoria, se crea y se borra en cada corrida (no toca ./data)
spring.application.name=fg-taller-git-2026-test
spring.datasource.url=jdbc:h2:mem:cs2test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Compañeros: en las pruebas no se usan los reales; EscenarioServiceTest los reemplaza por dobles HTTP
companeros.a2.nombre=Matias Enciso
companeros.a2.base-url=http://localhost:9
companeros.a2.ruta=/api/simulacion/explosion
companeros.a3.nombre=Diana Aquino
